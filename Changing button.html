<html>
    <head>
        <style>
            #myelement {
                border:1px solid black;
                width: 100px;
                height: 100px;    
            }
        </style>
        <meta charset="utf-8">
    </head>
    <body>
        <h2>Change font colour of html</h2>
        <div id="myElement">Hello World!!!</div>
        <br>
        <button type="button"
                onclick="changeStyle()">Click Me!</button>
        <script>
            function changeStyle() {
                document.getElementById("myElement").style.color = "red";
            }
        </script>
    </body>

</html>
